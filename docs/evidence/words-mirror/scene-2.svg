<svg xmlns="http://www.w3.org/2000/svg" width="380" height="784" viewBox="0 0 380 784" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="380" height="784" fill="#0d1117"/>
<text x="12.0" y="26.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">SCV 대시보드</text>
<rect x="12" y="35.0" width="356" height="64.0" rx="8" fill="#161b22" stroke="#4f8cff"/>
<text x="22.0" y="57.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">폴더</text>
<text x="52.0" y="57.0" font-size="12" fill="#8b949e" text-anchor="start">/work</text>
<text x="22.0" y="83.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">브랜치</text>
<rect x="64.0" y="69.0" width="54.1" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="91.0" y="83.0" font-size="11" fill="#c9d1d9" text-anchor="middle">main ▾</text>
<rect x="12" y="109.0" width="356" height="55.0" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="22.0" y="131.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">묻기 방식</text>
<text x="79.6" y="131.0" font-size="12" fill="#e6edf3" text-anchor="start">전부 묻기</text>
<rect x="204.3" y="117.0" width="153.7" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="281.1" y="131.0" font-size="11" fill="#c9d1d9" text-anchor="middle">처음 · 끝에만 묻기로 바꾸기</text>
<text x="22.0" y="153.0" font-size="12" fill="#8b949e" text-anchor="start">결정이 나올 때마다 선택 창으로 물음</text>
<rect x="12" y="174.0" width="356" height="124.0" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="22.0" y="192.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">저장해 둔 일(기어) 3</text>
<text x="22.0" y="209.0" font-size="12" fill="#8b949e" text-anchor="start">하려는 일을 그냥 말해도 맞는 것을 씁니다</text>
<text x="22.0" y="230.0" font-size="12" fill="#e6edf3" text-anchor="start">▸ 제목을 종류별로 묶음</text>
<rect x="320.0" y="216.0" width="38.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="339.0" y="230.0" font-size="11" fill="#c9d1d9" text-anchor="middle">실행</text>
<text x="22.0" y="256.0" font-size="12" fill="#e6edf3" text-anchor="start">▸ 목록을 만듦</text>
<rect x="320.0" y="242.0" width="38.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="339.0" y="256.0" font-size="11" fill="#c9d1d9" text-anchor="middle">실행</text>
<text x="22.0" y="282.0" font-size="12" fill="#e6edf3" text-anchor="start">▸ 릴리스 전 CI 를 다 돌림</text>
<rect x="320.0" y="268.0" width="38.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="339.0" y="282.0" font-size="11" fill="#c9d1d9" text-anchor="middle">실행</text>
<text x="12.0" y="316.0" font-size="12" fill="#8b949e" text-anchor="start">이 폴더에 진행 중인 SCV 계획이 없습니다. /scv:promote 로</text>
<text x="12.0" y="333.0" font-size="12" fill="#8b949e" text-anchor="start">계획을 만들면 여기에 보입니다.</text>
<text x="12.0" y="350.0" font-size="12" fill="#8b949e" text-anchor="start">확인한 곳: /work/scv/promote</text>
<rect x="12" y="359.0" width="356" height="409.0" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="22.0" y="381.0" font-size="12" fill="#e6edf3" text-anchor="start">▾ 낱말 사전 4</text>
<text x="22.0" y="403.0" font-size="12" fill="#8b949e" text-anchor="start">Claude 가 왼쪽 말이나 그 변형을 쓰려 할 때 오른쪽 말로 바꿔</text>
<text x="22.0" y="420.0" font-size="12" fill="#8b949e" text-anchor="start">씁니다</text>
<text x="22.0" y="441.0" font-size="12" fill="#e6edf3" text-anchor="start">재다 → 측정하다</text>
