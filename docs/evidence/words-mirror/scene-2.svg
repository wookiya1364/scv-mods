<text x="278.5" y="441.0" font-size="11" fill="#c9d1d9" text-anchor="middle">고치기</text>
<rect x="309.0" y="427.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="333.5" y="441.0" font-size="11" fill="#c9d1d9" text-anchor="middle">지우기</text>
<text x="36.0" y="463.0" font-size="12" fill="#8b949e" text-anchor="start">잰 · 재서 · 재 본</text>
<text x="22.0" y="484.0" font-size="12" fill="#e6edf3" text-anchor="start">돌리다 → 실행하다</text>
<rect x="254.0" y="470.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="278.5" y="484.0" font-size="11" fill="#c9d1d9" text-anchor="middle">고치기</text>
<rect x="309.0" y="470.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="333.5" y="484.0" font-size="11" fill="#c9d1d9" text-anchor="middle">지우기</text>
<text x="36.0" y="510.0" font-size="12" fill="#8b949e" text-anchor="start">변형 없음 — Claude 가 채움</text>
<rect x="195.8" y="496.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="220.3" y="510.0" font-size="11" fill="#c9d1d9" text-anchor="middle">채우기</text>
<text x="22.0" y="536.0" font-size="12" fill="#e6edf3" text-anchor="start">까먹다 → 잊다</text>
<rect x="254.0" y="522.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="278.5" y="536.0" font-size="11" fill="#c9d1d9" text-anchor="middle">고치기</text>
<rect x="309.0" y="522.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="333.5" y="536.0" font-size="11" fill="#c9d1d9" text-anchor="middle">지우기</text>
<text x="36.0" y="558.0" font-size="12" fill="#8b949e" text-anchor="start">까먹은 · 까먹어서</text>
<text x="22.0" y="579.0" font-size="12" fill="#e6edf3" text-anchor="start">살피다 → 확인하다</text>
<rect x="254.0" y="565.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="278.5" y="579.0" font-size="11" fill="#c9d1d9" text-anchor="middle">고치기</text>
<rect x="309.0" y="565.0" width="49.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="333.5" y="579.0" font-size="11" fill="#c9d1d9" text-anchor="middle">지우기</text>
<text x="36.0" y="601.0" font-size="12" fill="#8b949e" text-anchor="start">살핀 · 살펴서 · 살펴 본</text>
<text x="22.0" y="624.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">낱말 추가</text>
