<text x="52.0" y="57.0" font-size="12" fill="#8b949e" text-anchor="start">/work</text>
<text x="22.0" y="83.0" font-size="12" fill="#e6edf3" font-weight="600" text-anchor="start">컨텍스트</text>
<text x="76.0" y="83.0" font-size="12" fill="#8b949e" text-anchor="start">3%</text>
<text x="22.0" y="109.0" font-size="12" fill="#8b949e" text-anchor="start">컨텍스트가 50% 를 넘으면 자동으로 비우기 —</text>
<text x="22.0" y="126.0" font-size="12" fill="#8b949e" text-anchor="start">기록으로 이어 감</text>
<rect x="320.0" y="95.0" width="38.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="339.0" y="109.0" font-size="11" fill="#c9d1d9" text-anchor="middle">끄기</text>
<rect x="22.0" y="138.0" width="27.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="35.5" y="152.0" font-size="11" fill="#c9d1d9" text-anchor="middle">◀</text>
<rect x="55.0" y="144.0" width="150" height="8" rx="4" fill="#21262d"/>
<rect x="55.0" y="144.0" width="4.5" height="8" rx="4" fill="#4f8cff"/>
<rect x="129.0" y="140.0" width="2" height="16" fill="#e6edf3"/>
<rect x="211.0" y="138.0" width="27.0" height="20" rx="6" fill="#21262d" stroke="#484f58"/>
<text x="224.5" y="152.0" font-size="11" fill="#c9d1d9" text-anchor="middle">▶</text>
<text x="246.0" y="152.0" font-size="12" fill="#8b949e" text-anchor="start">비우기 기준 50%</text>
<text x="22.0" y="174.0" font-size="12" fill="#8b949e" text-anchor="start">비움 62% → 3% · 1초</text>
<line x1="12" y1="197.0" x2="368" y2="197.0" stroke="#30363d" stroke-dasharray="3 3"/>
<text x="12.0" y="211.0" font-size="10.5" fill="#d2a8ff" text-anchor="start">그림 설명: 턴이 끝나 비우기 명령이 받아들여진 뒤의 컨텍스트 칸 (시험</text>
<text x="12.0" y="226.0" font-size="10.5" fill="#d2a8ff" text-anchor="start">틀이 비우기를 흉내 냄). 마지막 줄이 결과 한 줄</text>
<text x="12.0" y="241.5" font-size="10.5" fill="#d2a8ff" text-anchor="start">돈 명령(시험 출력): clear</text>
<text x="12.0" y="257.0" font-size="10.5" fill="#d2a8ff" text-anchor="start">새 대화의 첫 글에 모드가 실은 것(시험 출력):</text>
<text x="12.0" y="272.5" font-size="10.5" fill="#d2a8ff" text-anchor="start">[SCV 뒤에서 도는 일] 대화를 비우기 전의 턴이 남기고 간 일입니다. 아직</text>
<text x="12.0" y="288.0" font-size="10.5" fill="#d2a8ff" text-anchor="start">돌고 있을 수 있고, 끝났다는 알림이 이 대화로 올 수 있습니다 — 알림이</text>
<text x="12.0" y="303.5" font-size="10.5" fill="#d2a8ff" text-anchor="start">오면 아래의 일로 읽으세요. 이 목록만 보고 새 일을 시작하지는 마세요.</text>
<text x="12.0" y="319.0" font-size="10.5" fill="#d2a8ff" text-anchor="start">- 명령: 측정 128판 — 출력 파일 /tmp/tasks/bg1.output</text>
<text x="12.0" y="334.5" font-size="10.5" fill="#d2a8ff" text-anchor="start">- 감시: PR 591 확인 지켜보기</text>
<line x1="12" y1="345.5" x2="368" y2="345.5" stroke="#30363d" stroke-dasharray="3 3"/>
